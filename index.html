<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="絶景日和">
<title>絶景日和</title>
<style>
  :root {
    --bg: #f4f4f6; --card: #ffffff; --text: #1c1c1e; --secondary: #6e6e73; --tertiary: #aeaeb2;
    --accent: #f08529; --line: rgba(0,0,0,.08);
    --spectacular: #d93d4a; --good: #f08529; --fair: #c9a227; --poor: #8c8c8c;
    --red: #d0342c; --orange: #d98a1f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #f2f2f7; --secondary: #98989f; --tertiary: #636366;
            --line: rgba(255,255,255,.1); --fair: #d4b247; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
         background: var(--bg); color: var(--text); font-size: 0.94rem; line-height: 1.5;
         padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width: 560px; margin: 0 auto; padding: 12px 14px 48px; }

  /* PC・タブレット横向き: 左に一覧、右に詳細の2ペイン。
     ただ幅を広げると1行が長くなって読みにくいので、列を分けて使う。 */
  @media (min-width: 900px) {
    main { max-width: 1060px; }
    /* 地点ヘッダーは全幅に伸ばすと間延びする */
    .place-row { max-width: 360px; }
    h1 { text-align: left; padding-left: 2px; }
    /* 詳細は「説明」と「裏づけの数値」で列を分ける。
       1行を長くしないためで、幅が余ってもこれ以上は広げない。 */
    .detail-wrap { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
                   gap: 0 22px; align-items: start; }
    /* 以前は左に一覧・右に詳細の2ペインだったが、一覧の役割は
       「この先7日」のマトリクスが担うようになったのでやめた。
       position:sticky も使わない。包含ブロックが記録カードの行まで伸びて
       週間の行が記録の上に描画される事故を起こしたうえ、
       要素がビューポートより高いと下端が読めなくなる。 */
    /* 広い側では数値表が収まるので横スクロールを出さない */
    .detail-side .scrollx { overflow-x: visible; }
    .detail-side table.numbers { width: 100%; }
    /* 週の一覧は列が増えるぶん、日付を少し広く取れる */
    .mx { grid-template-columns: 116px repeat(7, minmax(0, 1fr)); }
  }
  h1 { font-size: 1.13rem; text-align: center; padding: 6px 0 10px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .muted { color: var(--secondary); font-size: 0.75rem; }
  .tiny { color: var(--tertiary); font-size: 0.69rem; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .place-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 4px 2px 10px; }
  .place-row .pin { color: var(--accent); font-size: 1.25rem; }
  .place-row .name { font-size: 1.25rem; font-weight: 700; }
  .place-row .chev { margin-left: auto; color: var(--secondary); }

  .ens { display: flex; align-items: flex-end; gap: 2px; height: 44px; margin: 4px 0 2px; }
  .ens-bar { flex: 1; display: flex; align-items: flex-end; height: 100%;
             background: var(--line); border-radius: 2px; overflow: hidden; }
  .ens-bar > div { width: 100%; border-radius: 2px; min-height: 1px; }
  .ens-axis { display: flex; justify-content: space-between; font-size: 0.72rem;
              color: var(--muted); margin-bottom: 4px; }
  /* 小さな操作の当たり判定を広げる。見た目は変えず、押しやすさだけ上げる。
     ☆ は 16×24px しかなく、隣の地点ボタンを誤爆しやすかった。 */
  .tap { position: relative; }
  .tap::after { content: ""; position: absolute; left: 50%; top: 50%;
                transform: translate(-50%, -50%);
                width: max(100%, 44px); height: 44px; }
  /* ☆ は地点名のすぐ右にある。左右対称に広げると名前の末尾を奪うので、
     空いている右側と上下だけへ伸ばす。 */
  #favToggle::after { left: auto; right: -20px; transform: translateY(-50%);
                      width: 40px; }
  /* この先7日 × 7現象。56個のスコアを計算しているのに、
     これまでは1現象ずつ開かないと週を見られなかった。
     雲海・霧氷・ダイヤモンドダスト・星空は移動が前提で、
     「今週いつ行くか」を決めるのがこのアプリの主な使い道になる。 */
  .mx { display: grid; grid-template-columns: 84px repeat(7, minmax(0, 1fr));
        gap: 3px; align-items: stretch; }
  .mx .hd { font-size: 0.67rem; color: var(--tertiary); text-align: center;
            line-height: 1.15; padding-bottom: 2px; }
  .mx .hd.today { color: var(--accent); font-weight: 700; }
  .mx .lbl { display: flex; align-items: center; gap: 5px; font-size: 0.75rem;
             line-height: 1.15; min-width: 0; padding: 2px 4px 2px 2px; text-align: left;
             border-radius: 7px; width: 100%; }
  .mx .lbl .i { font-size: 0.94rem; flex: none; }
  .mx .lbl.on { background: color-mix(in srgb, var(--text) 10%, transparent); font-weight: 700; }
  @media (hover: hover) { .mx .lbl:hover, .mx .na:hover { background: color-mix(in srgb, var(--text) 7%, transparent); } }
  .mx .cell { border-radius: 7px; height: 34px; display: flex;
              align-items: center; justify-content: center; line-height: 1;
              border: 1.5px solid transparent; }
  .mx .cell .v { font-size: 0.78rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .mx-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px;
               font-size: 0.67rem; color: var(--tertiary); }
  .mx-legend .lg { display: inline-flex; align-items: center; gap: 4px; }
  .mx-legend .lg i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .mx .cell.sel { border-color: var(--text); }
  .mx .na { grid-column: 2 / -1; display: flex; align-items: center; font-size: 0.69rem;
            color: var(--tertiary); background: var(--line); border-radius: 7px;
            padding: 0 9px; width: 100%; text-align: left; min-height: 28px; }

  .scorebar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .scorebar > div { height: 100%; border-radius: 4px; }

  .highlight { border: 1px solid; }
  /* 数字ではなく評価の言葉を主役にする。
     スコアの実測誤差は ±9.5 点で、84 と 82 の差には意味がない。
     以前は 38.4px の数字に対して「±8点」が 11px と 3.5 倍の差があり、
     いちばん不確かなものがいちばん大きく出ていた。 */
  .highlight .verdict { font-size: 1.63rem; font-weight: 800; line-height: 1.1; }
  .highlight .big { font-size: 1.13rem; font-weight: 700; line-height: 1;
                    font-variant-numeric: tabular-nums; }
  .scorebar .band { position: absolute; top: 0; bottom: 0; opacity: .34; }
  .scorebar.withband { position: relative; }
  .badge { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; }

  .factors .f { padding: 6px 0; }
  .factors .fh { display: flex; justify-content: space-between; gap: 8px; font-size: 0.81rem; }
  .factors .mark { display: inline-block; width: 1.2em; font-weight: 700; }
  .factors .bar { position: relative; height: 6px; margin: 3px 0 2px; }
  .factors .bar .mid { position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1px; background: var(--line); }
  .factors .bar .fill { position: absolute; top: 0; height: 6px; border-radius: 3px; }
  .pm { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; padding: 2px 0; }
  /* 文字サイズを大きくするとモデル名が折り返してバーと縦がずれる。
     幅は下限として扱い、名前は折り返さない。 */
  .pm .n { min-width: 86px; flex: none; white-space: nowrap; color: var(--secondary); }
  .pm .v { width: 26px; text-align: right; color: var(--secondary); }
  .pm .scorebar { flex: 1; height: 5px; }

  .wk { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 0.81rem; width: 100%; text-align: left; }
  .wk .d { min-width: 62px; flex: none; white-space: nowrap; }
  .wk .t { min-width: 40px; flex: none; white-space: nowrap; color: var(--secondary); font-variant-numeric: tabular-nums; }
  .wk .scorebar { flex: 1; }
  .wk .s { width: 26px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .wk.sel { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 7px; }

  table.numbers { border-collapse: collapse; font-size: 0.75rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.numbers th, table.numbers td { padding: 4px 7px; text-align: right; color: var(--secondary); }
  table.numbers th { font-weight: 500; color: var(--tertiary); }
  table.numbers td:first-child, table.numbers th:first-child { text-align: left; color: var(--text); }
  .scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  .outcome { display: flex; gap: 8px; }
  .outcome button { flex: 1; text-align: center; font-size: 0.81rem; font-weight: 500; padding: 9px 0;
                    border-radius: 9px; background: var(--line); }
  .outcome button.on { background: var(--accent); color: #fff; }

  dialog { border: none; border-radius: 16px; background: var(--card); color: var(--text);
           width: min(92vw, 480px); max-height: 82vh; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
  .sheet-body { overflow-y: auto; max-height: calc(82vh - 54px); padding: 0 16px 16px; }
  .sheet input[type=search] { width: 100%; font: inherit; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; }
  .chips button { flex: none; font-size: 0.75rem; font-weight: 500; padding: 5px 11px; border-radius: 999px; background: var(--line); }
  .chips button.on { background: var(--accent); color: #fff; }
  .list-item { display: block; width: 100%; text-align: left; padding: 9px 2px; border-top: 1px solid var(--line); }
  .warn { color: var(--red); font-size: 0.75rem; }
  .notice { color: var(--orange); font-size: 0.75rem; }
  .section-h { display: flex; align-items: baseline; justify-content: space-between;
               gap: 10px; flex-wrap: wrap; margin: 4px 0 6px; }
  .section-h h2 { font-size: 0.94rem; }
  .bins .bin { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; padding: 3px 0; }
  .bins .lb { min-width: 48px; flex: none; white-space: nowrap; color: var(--secondary); font-variant-numeric: tabular-nums; }
  .bins .bar { flex: 1; position: relative; height: 10px; border-radius: 5px; background: var(--line); }
  .bins .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
  .bins .bar .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: color-mix(in srgb, var(--text) 40%, transparent); }
  .bins .pv { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>絶景日和</h1>
  <button class="place-row card" id="placeButton">
    <span class="pin">📍</span>
    <span>
      <span class="name" id="placeName">…</span>
      <div class="muted" id="placeSub"></div>
    </span>
    <span class="chev">▾</span>
  </button>

  <div class="card" id="nowcast" hidden></div>
  <div id="status" class="card muted" hidden></div>
  <button class="card highlight" id="highlight" hidden style="width:100%;text-align:left"></button>
  <div class="card" id="matrix"></div>
  <div id="detailPane"></div>

  <div class="card" id="records">
    <div class="section-h"><h2>記録</h2>
      <span><span class="muted" id="recCount"></span>
        <button id="exportBtn" class="muted tap" style="margin-left:8px">書き出し</button>
        <button id="importBtn" class="muted tap" style="margin-left:6px">読み込み</button>
        <input type="file" id="importFile" accept=".json" hidden></span></div>
    <div id="recEmpty" class="tiny" hidden>まだ記録がありません。現象の詳細で「実際に見えましたか？」に答えると、点数が当たっているかを測れるようになります。</div>
    <div id="recBody" hidden>
      <div class="bins" id="bins"></div>
      <p class="tiny" style="margin-top:6px">横棒が実際に見えた割合、縦線が点数どおりならこうなるはずという水準です。棒が線より短ければ点数が甘く、長ければ辛いということ。記録が無い帯は「—」と出します。</p>
      <div id="recList"></div>
    </div>
  </div>

  <p class="tiny" id="footer"></p>
</main>

<dialog class="sheet" id="placeSheet">
  <div class="sheet-head"><strong>地点</strong><button id="placeClose">閉じる</button></div>
  <div class="sheet-body">
    <input type="search" id="searchBox" placeholder="住所・地名・駅名（Enterで検索）">
    <div id="searchResults"></div>
    <button class="list-item" id="geoButton">📡 現在地を使う</button>
    <div id="geoStatus" class="warn"></div>
    <div class="section-h" style="margin-top:10px"><h2>お気に入り</h2></div>
    <div id="favList" class="muted">よく使う地点を ☆ で登録するとここに出ます</div>
    <div class="section-h" style="margin-top:10px"><h2>絶景スポット</h2></div>
    <div class="chips" id="spotChips"></div>
    <div id="spotList"></div>
  </div>
</dialog>

<script src="spots.js?v=20260826160554"></script>
<script src="sorami-core.js?v=20260826160554"></script>
<script>
"use strict";
const S = window.Sorami;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const RANK_COLOR = { spectacular: "var(--spectacular)", good: "var(--good)", fair: "var(--fair)", poor: "var(--poor)" };

// 「信頼度中 62–85」だけでは何のことか伝わらない。
// 何が・どれだけ・なぜ不確かなのかを、そのまま言葉にする。
//
// 出どころは2系統。アンサンブル（51通りの計算）が取れていれば
// 「スコアが何点ずれそうか」まで言える。取れなければモデルの割れ方で代用する。
function confidenceText(ev) {
  const u = ev.uncertainty;
  const d = ev.daysAhead || 0;
  const parts = [];

  if (u && u.basis === "ensemble") {
    const e = Math.round(u.expectedError);
    // 「±0点」は精度の主張として強すぎる。1点未満はまとめて「ほぼ動きません」。
    parts.push(e < 1
      ? `${u.ensembleMembers}通りの計算がほぼ一致していて、点数はあまり動きません`
      : `${u.ensembleMembers}通りの計算から、点数は ±${e}点 ほど動く見込みです`);
    if (ev.confidence.key === "medium") parts.push("評価が1段変わり得ます");
    else if (ev.confidence.key === "low") parts.push("評価はあてになりません");
  } else {
    const lo = Math.round(ev.spread[0]), hi = Math.round(ev.spread[1]);
    const n = Object.keys(ev.perModel).length;
    const spreadWide = hi - lo >= 30;
    if (ev.confidence.key === "high") parts.push(`${n}つの予報モデルがほぼ同じ見立てです（${lo}〜${hi}点）`);
    else if (spreadWide) parts.push(`予報モデルの見立てが ${lo}〜${hi}点 と割れています`);
    else parts.push(`予報モデルは ${lo}〜${hi}点 でおおむね揃っています`);
  }

  // 日数の注意は残す。アンサンブルのばらつきは日数とともに広がるが、
  // 数日先のスコア誤差そのものは検証できていないため、言葉で補う。
  if (d >= 5) parts.push(`${d}日先なので、日が近づいたら見直してください`);
  else if (d >= 2) parts.push(`${d}日先の予報です`);
  return parts.join("。");
}
// 51メンバーの散らばりを見せる。「信頼度 中」と言われるより、
// 51本がどう散らばっているかを見たほうが、利用者は自分で判断できる。
//
// ただしメンバーの【絶対値は本体スコアと比べられない】。メンバー側は
// 太陽方位オフセットも視程も持たず、ECMWF 単独で計算しているため、
// 実データで本体スコアと最大 31 点ずれる。並べて出すと
// 「どっちが本当なの」という答えられない問いを生む。
// そこで本体スコアを中心に重ね直し、【散らばりの形だけ】を見せる。
function renderEnsemble(ev) {
  const u = ev.uncertainty;
  if (!u || u.basis !== "ensemble" || !u.ensembleScores) return "";
  const shift = ev.score - u.ensembleMedian;
  const shifted = u.ensembleScores.map((v) => Math.round(Math.max(0, Math.min(100, v + shift))));
  const hist = Array(10).fill(0);
  for (const v of shifted) hist[Math.min(9, Math.floor(v / 10))]++;
  const peak = Math.max(...hist, 1);
  const sorted = [...shifted].sort((a, b) => a - b);
  const q = (p) => sorted[Math.round((sorted.length - 1) * p)];
  const lo = q(0.1), hi = q(0.9), q1 = q(0.25), q3 = q(0.75);
  const bars = hist.map((c, i) => {
    const mid = i * 10 + 5, inBand = mid >= q1 && mid <= q3;
    return `<div class="ens-bar" title="${i * 10}〜${i * 10 + 9}点: ${c}通り">
      <div style="height:${Math.round(100 * c / peak)}%;background:${inBand ? RANK_COLOR[S.rankOf(mid).key] : "var(--line)"}"></div></div>`;
  }).join("");
  const ranks = [...new Set(shifted.map((v) => S.rankOf(v).label))];
  return `<div class="section-h" style="margin-top:8px"><h2>この点数はどれくらい動きうるか</h2></div>
    <div class="ens">${bars}</div>
    <div class="ens-axis"><span>0</span><span>50</span><span>100</span></div>
    <p class="tiny">ECMWF が初期値をわずかに変えて計算した${u.ensembleMembers}通りの散らばりを、
      この点数（${Math.round(ev.score)}点）を中心に重ねたものです。
      色が付いているのが真ん中の半分（${q1}〜${q3}点）、上下1割を除くと ${lo}〜${hi}点。
      ${ranks.length > 1 ? `評価としては<strong>${ranks.join("・")}</strong>のいずれもあり得ます。` : `評価は<strong>${ranks[0]}</strong>で動きません。`}</p>
    <p class="tiny">点数そのものは8つの予報モデルの中央値です。この${u.ensembleMembers}通りは
      <strong>動きうる幅を測るためだけ</strong>に使っています
      （太陽の方向の空を見ていないので、点数の高さ自体は比べられません）。</p>`;
}
// 「次の見どころ」は 36 時間以内の最高スコアを出すだけなので、
// 全部だめな日でも 29 点の「不向き」がそこに載る（実データで確認）。
// 見どころと呼べない日に見どころと書かない。
const HIGHLIGHT_HEAD = {
  spectacular: "次の見どころ", good: "次の見どころ",
  fair: "いちばん期待できるもの", poor: "めぼしい空はなさそうです",
};
const CONF_ICON = { high: "◎", medium: "△", low: "⚠︎" };

// ---------------------------------------------------------------- 永続化（localStorage）
const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private mode */ } },
};
let place = store.get("sorami.place",
  { id: "default", name: "東京", subtitle: "東京都", latitude: 35.6812, longitude: 139.7671, terrain: null, elevation: null });
let favorites = store.get("sorami.favorites", []);
let sightings = store.get("sorami.sightings", []);

// 900px 以上は2ペイン。狭い側はこれまでどおりアコーディオン。
const WIDE = window.matchMedia("(min-width: 900px)");
let picked = null;       // 2ペインで右に出している現象

let bundle = null;       // 取得済みの予報
let weeks = {};          // phenomenon → [{dayMs, evaluation}]
let selectedDay = {};    // phenomenon → dayMs

// ---------------------------------------------------------------- 読み込み
async function load(force) {
  $("status").hidden = false;
  $("status").textContent = "4つの気象モデルから取得しています…";
  $("highlight").hidden = true;
  try {
    // 光害はその地点の素質なので予報と並行に取得する。取れなくても致命的ではない。
    const [fetched, lp] = await Promise.all([
      S.fetchForecast(place.latitude, place.longitude),
      S.LightPollution.lookup(place.latitude, place.longitude).catch(() => null),
    ]);
    bundle = fetched;
    place.lightPollution = lp;
    weeks = {};
    for (const id of Object.keys(S.SCORERS)) {
      weeks[id] = S.evaluateWeek(id, bundle, place);
    }
    $("status").hidden = true;
    render();
    loadNowcast().catch(() => { $("nowcast").hidden = true; });  // 実況は補助。失敗しても予報は出す
  } catch (e) {
    $("status").hidden = false;
    $("status").innerHTML = `<span class="warn">予報を取得できませんでした（${esc(e.message)}）</span> <button id="retry" style="color:var(--accent)">再試行</button>`;
    $("retry").onclick = () => load(true);
  }
}

// アメダス実況。更新は10分間隔なのでそれより短く取りに行かない。
let amedasStations = null;
async function loadNowcast() {
  const latest = await S.Amedas.latestTime();
  if (!amedasStations) amedasStations = await S.Amedas.stations();
  const obs = await S.Amedas.nearest(place.latitude, place.longitude, amedasStations, latest,
    place.elevation ?? bundle?.home.grid.elevation);
  const daytime = S.Sun.position(obs.observedAt, place.latitude, place.longitude).elevation > 0;
  const disagreements = bundle ? S.Nowcast.compare(obs, bundle.home) : [];
  const parts = [S.Amedas.condition(obs, daytime)];
  if (obs.temperature !== null) parts.push(`${obs.temperature.toFixed(1)}℃`);
  if (obs.humidity !== null) parts.push(`湿度${Math.round(obs.humidity)}%`);
  let html = `<div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap">
    <span class="muted">実況 ${S.JstCal.hhmm(obs.observedAt)}</span>
    <strong>${esc(parts.join(" "))}</strong>
    <span class="tiny" style="margin-left:auto">${esc(obs.station.name)} ${Math.round(obs.distanceKm)}km</span></div>`;
  for (const line of S.Amedas.supplementSummary(obs)) html += `<div class="tiny">${esc(line)}</div>`;
  for (const d of disagreements) html += `<div class="${d.severe ? "warn" : "notice"}">⚠ ${esc(d.message)}</div>`;
  $("nowcast").innerHTML = html;
  $("nowcast").hidden = false;
}

// ---------------------------------------------------------------- 描画
function upcoming(entries, now) {
  return entries.find((e) => !e.evaluation.unavailable && e.evaluation.window[1] > now)
      || entries.find((e) => !e.evaluation.unavailable) || entries[0];
}

function render() {
  const now = Date.now();
  $("placeName").textContent = place.name;
  const subParts = [];
  if (place.subtitle) subParts.push(place.subtitle);
  const elev = place.elevation ?? bundle?.home.grid.elevation;
  if (elev !== null && elev !== undefined) subParts.push(`標高 ${Math.round(elev)}m`);
  $("placeSub").textContent = subParts.join(" ・ ");

  // 次の見どころ: 36時間以内・評価済み・未来の回のうち最高スコア
  let best = null;
  for (const [id, entries] of Object.entries(weeks)) {
    const u = upcoming(entries, now);
    if (!u || u.evaluation.unavailable) continue;
    if (u.evaluation.window[1] <= now || u.evaluation.peak > now + 36 * 3600000) continue;
    if (!best || u.evaluation.score > best.u.evaluation.score) best = { id, u };
  }
  if (best) {
    const ev = best.u.evaluation, color = RANK_COLOR[ev.rank.key];
    $("highlight").hidden = false;
    $("highlight").style.borderColor = color;
    // 詳細の頭と同じカードを二度出すと、同じ点数が画面に二回並ぶ。
    // ここは「どれを見ればいいか」を指すだけの一行に徹する。
    $("highlight").innerHTML = `
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:1.5rem;flex:none">${S.PHENOMENA[best.id].icon}</span>
        <span style="flex:1;min-width:0">
          <span class="muted" style="font-size:0.72rem">${HIGHLIGHT_HEAD[ev.rank.key]}</span>
          <div><strong>${S.PHENOMENA[best.id].name}</strong>
            <span class="muted">${S.JstCal.relativeDay(best.u.dayMs, now)}${ev.specificTime === false ? "" : " " + S.JstCal.hhmmRounded(ev.peak)}</span>
            ・<span style="color:${color};font-weight:700">${esc(S.phrasing(best.id, ev.rank).label)}</span></div></span>
        <span class="chev muted" style="flex:none">▸</span>
      </div>`;
    $("highlight").onclick = () => {
      picked = best.id;
      selectedDay[best.id] = best.u.dayMs;
      render();
      $("detailPane").scrollIntoView({ behavior: "smooth", block: "start" });
    };
  } else $("highlight").hidden = true;

  // 一覧の並び: 評価できるものが先 → 時刻が決まっているものが先 → 直近に起きる順。
  //
  // 「時刻が決まっているか」を挟むのが要点。虹は雨の時間を特定できない日でも
  // 窓の開始時刻を持っており、それで並べると朝の早い時刻として先頭に来る。
  // 実際に 2点「期待薄」の虹が 84点の夕焼けより上に出ていた。
  // 画面ではその時刻を表示しない（specificTime === false）のに、
  // 表示しない時刻で並べていたことになる。
  const order = Object.keys(weeks).sort((a, b) => {
    const ua = upcoming(weeks[a], now), ub = upcoming(weeks[b], now);
    const aOk = ua && !ua.evaluation.unavailable, bOk = ub && !ub.evaluation.unavailable;
    if (aOk !== bOk) return aOk ? -1 : 1;
    if (aOk) {
      const aTimed = ua.evaluation.specificTime !== false;
      const bTimed = ub.evaluation.specificTime !== false;
      if (aTimed !== bTimed) return aTimed ? -1 : 1;
    }
    const pa = aOk ? ua.evaluation.peak : Infinity, pb = bOk ? ub.evaluation.peak : Infinity;
    if (pa !== pb) return pa - pb;
    return S.PHENOMENA[a].order - S.PHENOMENA[b].order;
  });
  // 選択中の現象。未選択なら見どころ、それも無ければ評価できる最初のもの。
  const evaluable = order.filter((id) => {
    const u = upcoming(weeks[id], now);
    return u && !u.evaluation.unavailable;
  });
  if (!picked || !weeks[picked]) picked = best ? best.id : (evaluable[0] || order[0]);

  $("matrix").innerHTML = renderMatrix(order, now);
  $("detailPane").innerHTML = renderDetailPane(picked, now);
  const showDetail = () => $("detailPane").scrollIntoView({ behavior: "smooth", block: "start" });
  for (const el of $("matrix").querySelectorAll("[data-cell]")) {
    el.onclick = () => {
      const [id, dayMs] = el.dataset.cell.split("|");
      picked = id;
      selectedDay[id] = +dayMs;
      render();
      showDetail();
    };
  }
  // 現象名を押したときは日付を指定していないので、直近の回に合わせる。
  for (const el of $("matrix").querySelectorAll("[data-pick]")) {
    el.onclick = () => {
      const id = el.dataset.pick;
      picked = id;
      const u = upcoming(weeks[id], now);
      if (u) selectedDay[id] = u.dayMs;
      render();
      showDetail();
    };
  }

  const scope = document.querySelector("main");
  for (const el of scope.querySelectorAll("[data-day]")) {
    el.onclick = () => {
      const host = el.closest("[data-id]");
      selectedDay[host.dataset.id] = +el.dataset.day;
      render();
    };
  }
  for (const el of scope.querySelectorAll("[data-outcome]")) {
    el.onclick = () => recordOutcome(el.dataset.pid, +el.dataset.peak, el.dataset.outcome);
  }
  renderRecords();
  $("footer").innerHTML =
    `${bundle ? S.JstCal.hhmm(bundle.fetchedAt) : "—"} 時点の予報。`
    + `${S.MODELS.length}つの数値予報モデル（${S.MODELS.map((m) => S.MODEL_NAMES[m]).join("・")}）の`
    + `真ん中の値を点数にしています。<br>`
    + (bundle && bundle.ensemble
        ? `点数がどれくらい動きうるかは、ECMWF が初期値をわずかに変えて計算した`
          + `${bundle.ensemble.members.length}通り（アンサンブル予報）の散らばりから出しています。<br>`
        : `${bundle ? "アンサンブル予報が取れなかったため、" : ""}`
          + `点数の確からしさはモデル間の見解の差から出しています。<br>`)
    + `夕焼け・朝焼けは、頭上だけでなく日の入り方向 ${bundle ? Math.round(bundle.sunsetBearing) : "—"}° の空の雲も見ています。<br>`
    + `<strong>これは予報です。</strong>実際の空とは違うことがあります。見に行くかどうかの目安としてお使いください。<br>`
    + `予報: Open-Meteo ／ 実況: 気象庁アメダス ／ 光害: <a href="https://djlorenz.github.io/astronomy/lp/">Lorenz Light Pollution Atlas 2025</a>（VIIRS） ／ 検索: OSM Nominatim ・ 国土地理院`;
}

// この先7日 × 全現象。
//
// これまで 56 個のスコア（7現象×8日）を計算しておきながら、画面に出ていたのは
// 今日の最高・今日の7現象・1現象ぶんの週間だけだった。「今週いつ、何が良いか」を
// 知るには7回開いて頭の中で転置するしかなかった。
// 雲海・霧氷・ダイヤモンドダスト・星空は移動が前提で、計画してこそ使える。
//
// セルは評価の色を主役にし、点数は小さく添える。点数の実測誤差は ±9.5 点なので、
// 84 と 82 を並べて見比べる意味はない。色（＝評価）が判断の単位。
function renderMatrix(order, now) {
  const days = weeks[order[0]] ? weeks[order[0]].map((e) => e.dayMs) : [];
  if (!days.length) return "";
  const head = `<div class="hd"></div>` + days.map((d) => {
    const label = S.JstCal.relativeDay(d, now).replace(/^(\d+)\/(\d+)\((.)\)$/, "$1/$2<br>$3");
    const today = d === S.JstCal.startOfDay(now);
    return `<div class="hd${today ? " today" : ""}">${label}</div>`;
  }).join("");

  const rows = order.map((id) => {
    const entries = weeks[id];
    const meta = S.PHENOMENA[id];
    if (!entries || !entries.length) return "";
    const on = id === picked ? " on" : "";
    const label = `<button class="lbl${on}" data-pick="${id}">
      <span class="i">${meta.icon}</span><span>${meta.name}</span></button>`;
    // 7日すべて対象外なら、空のセルを7個並べるより理由を1行書いたほうが伝わる。
    // ただしその行には押せるセルが無くなるので、名前のほうを押せるようにしてある
    // （そうしないと雲海・霧氷・ダイヤモンドダストの詳細へ到達できない）。
    const allOut = entries.every((e) => e.evaluation.unavailable);
    if (allOut) {
      return label + `<button class="na" data-pick="${id}">${esc(entries[0].evaluation.unavailable.message)}</button>`;
    }
    return label + entries.map((e) => {
      const ev = e.evaluation;
      if (ev.unavailable) return `<div class="cell" style="background:var(--line)"></div>`;
      const color = RANK_COLOR[ev.rank.key];
      const sel = id === picked && e.dayMs === (selectedDay[id] ?? -1) ? " sel" : "";
      return `<button class="cell${sel}" data-cell="${id}|${e.dayMs}"
        style="background:color-mix(in srgb,${color} 22%,transparent)"
        title="${esc(meta.name)} ${S.JstCal.relativeDay(e.dayMs, now)} ${Math.round(ev.score)}点 ${esc(S.phrasing(id, ev.rank).label)}">
        <span class="v" style="color:${color}">${Math.round(ev.score)}</span></button>`;
    }).join("");
  }).join("");

  // 色が評価、数字が点数。セルに評価の言葉を入れると3行に折り返して読めなくなるため、
  // 言葉は凡例で一度だけ示す。
  const legend = S.RANKS.map((r) => `<span class="lg">
      <i style="background:${RANK_COLOR[r.key]}"></i>${r.label}</span>`).join("");
  return `<div class="section-h"><h2>この先7日</h2>
      <span class="tiny">押すとその日の詳しい内容が出ます</span></div>
    <div class="mx">${head}${rows}</div>
    <div class="mx-legend">${legend}</div>`;
}

/// 選択中の現象の詳細。広い画面では「説明」と「裏づけの数値」で列を分ける。
function renderDetailPane(id, now) {
  const entries = weeks[id];
  if (!entries || !entries.length) return "";
  const u = upcoming(entries, now);
  const sel = entries.find((e) => e.dayMs === selectedDay[id]) || u;
  const ev = sel.evaluation;
  const meta = S.PHENOMENA[id];
  if (ev.unavailable) {
    return `<div data-id="${id}"><div class="card"><div style="display:flex;gap:10px;align-items:center">
      <span style="font-size:1.9rem">${meta.icon}</span>
      <span><strong style="font-size:1.19rem">${meta.name}</strong>
      <div class="muted">${esc(ev.unavailable.message)}</div></span></div></div>
      <div class="card">${renderWeek(id, entries, sel, now)}</div></div>`;
  }
  const color = RANK_COLOR[ev.rank.key];
  const head = `<div class="card highlight" style="border-color:${color}">
      <div style="display:flex;gap:12px;align-items:center">
        <span style="font-size:1.9rem">${meta.icon}</span>
        <span style="flex:1"><strong style="font-size:1.19rem">${meta.name}</strong>
          <div class="muted">${S.JstCal.relativeDay(sel.dayMs, now)}${ev.specificTime === false ? "" : " " + S.JstCal.hhmmRounded(ev.peak)}</div></span>
        ${renderVerdict(id, ev)}
      </div>
      ${renderScoreBar(ev)}
      <div style="margin-top:8px">${esc(S.phrasing(id, ev.rank).say)}</div>
      <div class="tiny" style="margin-top:4px">${CONF_ICON[ev.confidence.key]} ${esc(confidenceText(ev))}</div></div>`;
  return `<div data-id="${id}">${head}
    <div class="detail-wrap">
      <div class="detail-main"><div class="card">${renderDetail(id, sel, now, { hideSay: true, hideConfidence: true })}</div></div>
      <div class="detail-side">
        <div class="card">${renderWeek(id, entries, sel, now)}${renderTable(id, entries)}</div>
        <p class="tiny" style="padding:0 4px">📖 ${esc(ev.source)}</p>
      </div>
    </div></div>`;
}

// 評価の言葉を主役、点数を従にする。
//
// 点数の実測誤差は ±9.5 点（10地点×61日＝610標本）。ランク境界の間隔は 20〜25 点なので、
// 83% の日はランクが動かない。動かないほうを大きく出す。
// 以前は数字が 38.4px、誤差の但し書きが 11px で、いちばん不確かなものがいちばん大きかった。
function renderVerdict(id, ev) {
  const color = RANK_COLOR[ev.rank.key];
  const err = ev.uncertainty && ev.uncertainty.expectedError !== null
    ? Math.round(ev.uncertainty.expectedError) : null;
  return `<span style="text-align:right">
    <div class="verdict" style="color:${color}">${esc(S.phrasing(id, ev.rank).label)}</div>
    <div class="big muted">${Math.round(ev.score)}${err !== null ? ` <span style="font-weight:400">±${err}</span>` : ""}</div></span>`;
}

// 点数のバーに、動きうる幅を薄い帯で重ねる。
// 「84」の一点だけを見せると、±8 の幅があることが目に入らない。
function renderScoreBar(ev) {
  const color = RANK_COLOR[ev.rank.key];
  const err = ev.uncertainty && ev.uncertainty.expectedError !== null ? ev.uncertainty.expectedError : null;
  if (err === null) {
    return `<div class="scorebar" style="margin:10px 0 0"><div style="width:${ev.score}%;background:${color}"></div></div>`;
  }
  const lo = Math.max(0, ev.score - err), hi = Math.min(100, ev.score + err);
  return `<div class="scorebar withband" style="margin:10px 0 0">
    <div style="width:${ev.score}%;background:${color}"></div>
    <span class="band" style="left:${lo}%;width:${hi - lo}%;background:${color}"></span></div>`;
}

// 効き具合を記号にする。数字を読まなくても、何が良くて何が足を引っ張っているかが分かる。
//
// 符号だけで決めてはいけない。星空の雲量のように「減点しか無い」要素では、
// 小さな減点はむしろ good な状態を意味する（雲量8%で -4.5 に ✕ を出すと、
// 説明文の「ほとんど雲がありません」と矛盾する）。
// そこで、その評価の中で最も大きな減点・加点を基準にした相対的な重さで決める。
function factorMark(c, maxPositive, maxNegative) {
  if (c < 0) {
    const severity = maxNegative > 0 ? Math.abs(c) / maxNegative : 1;
    if (severity >= 0.6) return { m: "✕", color: "var(--red)" };
    if (severity >= 0.25) return { m: "△", color: "var(--orange)" };
    return { m: "○", color: "var(--accent)" };
  }
  if (c > 0) {
    return c >= maxPositive * 0.6
      ? { m: "◎", color: "var(--accent)" }
      : { m: "○", color: "var(--accent)" };
  }
  return { m: "－", color: "var(--tertiary)" };
}

function renderDetail(id, sel, now, opts = {}) {
  const ev = sel.evaluation;
  const maxAbs = Math.max(1, ...ev.factors.map((f) => Math.abs(f.c)));
  const maxPos = Math.max(0.01, ...ev.factors.map((f) => f.c));
  const maxNeg = Math.max(0.01, ...ev.factors.map((f) => -f.c));
  const factors = ev.factors.map((f) => {
    const pos = f.c >= 0, w = Math.min(50, 50 * Math.abs(f.c) / maxAbs);
    const mk = factorMark(f.c, maxPos, maxNeg);
    return `<div class="f"><div class="fh">
      <span><span class="mark" style="color:${mk.color}">${mk.m}</span>${esc(f.label)}</span>
      <strong style="color:${pos ? "var(--accent)" : "var(--red)"}">${f.c >= 0 ? "+" : ""}${f.c.toFixed(1)}</strong></div>
      <div class="bar"><span class="mid"></span>
        <span class="fill" style="${pos ? `left:50%` : `left:${50 - w}%`};width:${w}%;background:${pos ? "var(--accent)" : "var(--red)"};opacity:.75"></span></div>
      ${f.detail ? `<div class="tiny">${esc(f.detail)}</div>` : ""}</div>`;
  }).join("");
  const perModel = S.MODELS.filter((m) => ev.perModel[m] !== undefined).map((m) => {
    const v = ev.perModel[m], color = RANK_COLOR[S.rankOf(v).key];
    return `<div class="pm"><span class="n">${S.MODEL_NAMES[m]}</span>
      <span class="scorebar"><div style="width:${v}%;background:${color}"></div></span>
      <span class="v">${Math.round(v)}</span></div>`;
  }).join("");
  // 記録できるのはその回が終わってから。まだ来ていない空は評価できない。
  const finished = ev.window[1] <= now;
  const current = findSighting(id, ev.peak);
  const outcomes = [["seen", "見えた"], ["missed", "見えなかった"], ["unchecked", "確認せず"]];
  const record = finished
    ? `<div style="padding:8px 0"><div style="margin-bottom:6px">実際に見えましたか？</div>
       <div class="outcome">${outcomes.map(([k, l]) =>
         `<button data-outcome="${k}" data-pid="${id}" data-peak="${ev.peak}" class="${current?.outcome === k ? "on" : ""}">${l}</button>`).join("")}</div></div>`
    : `<p class="tiny" style="padding:4px 0">${S.JstCal.hhmmRounded(ev.peak)} を過ぎたら記録できます</p>`;
  return `<div style="padding:4px 0 6px">
    ${opts.hideSay ? "" : `<div style="font-size:0.94rem;margin-bottom:4px">${esc(S.phrasing(id, ev.rank).say)}</div>`}
    ${opts.hideConfidence ? "" : `<div class="tiny" style="margin-bottom:8px">${CONF_ICON[ev.confidence.key]} ${esc(confidenceText(ev))}</div>`}
    <div class="section-h"><h2>この点数のわけ</h2><span class="tiny">基準 ${Math.round(ev.base)} → ${Math.round(ev.score)}</span></div>
    <div class="factors">${factors}</div>
    <div class="section-h" style="margin-top:8px"><h2>予報モデルごとの見立て</h2></div>${perModel}
    ${renderEnsemble(ev)}
    ${record}
  </div>`;
}

function renderWeek(id, entries, sel, now) {
  return `<div style="padding:2px 0 6px"><div class="section-h"><h2>週間</h2></div>` + entries.map((e) => {
    const ev = e.evaluation;
    if (ev.unavailable) {
      return `<div class="wk"><span class="d">${S.JstCal.relativeDay(e.dayMs, now)}</span>
        <span class="tiny" style="flex:1">${esc(ev.unavailable.message)}</span></div>`;
    }
    const color = RANK_COLOR[ev.rank.key];
    return `<button class="wk ${e.dayMs === sel.dayMs ? "sel" : ""}" data-day="${e.dayMs}">
      <span class="d">${S.JstCal.relativeDay(e.dayMs, now)}</span>
      <span class="t">${ev.specificTime === false ? "" : S.JstCal.hhmmRounded(ev.peak)}</span>
      <span class="scorebar"><div style="width:${ev.score}%;background:${color}"></div></span>
      <span class="s" style="color:${color}">${Math.round(ev.score)}</span>
      <span class="tiny">${CONF_ICON[ev.confidence.key]}</span></button>`;
  }).join("") + `</div>`;
}

function renderTable(id, entries) {
  if (!bundle) return "";
  const hasSunward = id === "sunset" || id === "sunrise";
  const fmt = (v, unit, dec = 0) => (v === null || v === undefined) ? "—"
    : dec ? v.toFixed(dec) + unit : Math.round(v) + unit;
  const rows = entries.filter((e) => !e.evaluation.unavailable).map((e) => {
    const r = S.readingAt(bundle, id, e.evaluation.peak);
    return `<tr><td>${S.JstCal.relativeDay(e.dayMs, Date.now())}</td>
      <td style="color:${RANK_COLOR[e.evaluation.rank.key]};font-weight:600">${Math.round(e.evaluation.score)}</td>
      <td>${fmt(r.cloudLow, "%")}</td><td>${fmt(r.cloudMid, "%")}</td><td>${fmt(r.cloudHigh, "%")}</td>
      ${hasSunward ? `<td>${fmt(r.sunwardLow, "%")}</td><td>${fmt(r.sunwardMid, "%")}</td><td>${fmt(r.sunwardHigh, "%")}</td>` : ""}
      <td>${fmt(r.precipitation, "", 1)}</td><td>${fmt(r.humidity, "%")}</td>
      <td>${fmt(r.temperature, "℃", 1)}</td>
      <td>${r.visibility === null || r.visibility === undefined ? "—" : Math.round(r.visibility / 1000) + "km"}</td></tr>`;
  }).join("");
  if (!rows) return "";
  return `<details style="padding:4px 0"><summary class="muted" style="cursor:pointer">詳しい数値</summary>
    <div class="scrollx"><table class="numbers">
    <tr><th></th><th>点</th><th>低層</th><th>中層</th><th>高層</th>
    ${hasSunward ? "<th>陽低</th><th>陽中</th><th>陽高</th>" : ""}
    <th>降水</th><th>湿度</th><th>気温</th><th>視程</th></tr>${rows}</table></div>
    <p class="tiny">モデル横断の中央値。「陽側」は太陽方位へ低層165km・中層260km・高層368km離れた地点の雲量。</p></details>`;
}

// ---------------------------------------------------------------- 記録・校正
function findSighting(pid, peak) {
  return sightings.find((s) => s.phenomenon === pid && s.placeName === place.name && S.JstCal.sameDay(s.peak, peak));
}
function recordOutcome(pid, peak, outcome) {
  const entries = weeks[pid] || [];
  const entry = entries.find((e) => Math.abs(e.evaluation.peak - peak) < 60000);
  if (!entry) return;
  const ev = entry.evaluation;
  const existing = findSighting(pid, peak);
  const record = {
    id: existing?.id || crypto.randomUUID(),
    recordedAt: Date.now(), phenomenon: pid, placeName: place.name,
    latitude: place.latitude, longitude: place.longitude,
    peak, score: ev.score, rank: ev.rank.key, confidence: ev.confidence.key,
    perModel: ev.perModel, factors: ev.factors, outcome,
    observations: collectObservations(pid, peak),
  };
  if (existing) sightings = sightings.map((s) => (s.id === existing.id ? record : s));
  else sightings.push(record);
  store.set("sorami.sightings", sightings);
  render();
}
// 生の気象値を残す。閾値を変えたときに過去の記録を再採点できなければ校正のデータにならない。
function collectObservations(pid, peak) {
  if (!bundle) return {};
  const out = {};
  for (const [m, series] of Object.entries(bundle.home.byModel)) {
    for (const v of S.HOME_VARS) {
      if (!series.isSupported(v)) continue;
      const value = series.valueAt(v, peak);
      if (value !== null) out[`${v}@${m}`] = value;
    }
  }
  const offsets = pid === "sunrise" ? bundle.sunriseOffsets : bundle.sunsetOffsets;
  if (offsets) {
    for (const layer of S.CLOUD_LAYERS) {
      const loc = offsets[layer.key];
      if (!loc) continue;
      for (const [m, series] of Object.entries(loc.byModel)) {
        const value = series.valueAt(layer.variable, peak);
        if (value !== null) out[`${layer.variable}@${m}#sunward-${layer.key}`] = value;
      }
    }
  }
  out._grid_elevation = bundle.home.grid.elevation;
  return out;
}
function renderRecords() {
  const conclusive = sightings.filter((s) => s.outcome !== "unchecked");
  $("recCount").textContent = `確定 ${conclusive.length}件`;
  // 記録がゼロのうちは、空の5帯グラフを毎回出しても読むものがない。
  // 何をすれば貯まるかだけ書く。
  const empty = sightings.length === 0;
  $("recEmpty").hidden = !empty;
  $("recBody").hidden = empty;
  if (empty) return;
  let bins = "";
  for (let lo = 0; lo < 100; lo += 20) {
    const hi = lo + 20;
    const inBin = conclusive.filter((s) => s.score >= lo && (s.score < hi || hi === 100));
    const seen = inBin.filter((s) => s.outcome === "seen").length;
    // 標本ゼロの帯は 0% ではなく「—」。データが無いことと外れたことを区別する。
    const rate = inBin.length ? seen / inBin.length : null;
    const predicted = (lo + hi) / 2;
    bins += `<div class="bin"><span class="lb">${lo}–${hi}</span>
      <span class="bar">${rate !== null ? `<span class="fill" style="width:${rate * 100}%;background:${RANK_COLOR[S.rankOf(predicted).key]}"></span>` : ""}
        <span class="mark" style="left:${predicted}%"></span></span>
      <span class="pv">${rate !== null ? Math.round(rate * 100) + "%" : "—"}</span>
      <span class="tiny" style="width:20px;text-align:right">${inBin.length}</span></div>`;
  }
  $("bins").innerHTML = bins;
  const OUTCOME_LABEL = { seen: "見えた", missed: "見えなかった", unchecked: "確認せず" };
  $("recList").innerHTML = [...sightings].sort((a, b) => b.peak - a.peak).slice(0, 30).map((s) => `
    <div class="list-item" style="display:flex;gap:8px;align-items:center">
      <span>${S.PHENOMENA[s.phenomenon].icon}</span>
      <span style="flex:1"><strong style="font-size:0.81rem">${S.JstCal.monthDay(s.peak)} ${esc(s.placeName)}</strong>
        <div class="tiny">${S.PHENOMENA[s.phenomenon].name} ・ ${Math.round(s.score)}点</div></span>
      <span class="badge" style="background:var(--line)">${OUTCOME_LABEL[s.outcome]}</span></div>`).join("")
    || `<p class="tiny" style="padding:8px 0">現象を開いて「実際に見えましたか？」に答えると貯まります。</p>`;
}

// ---------------------------------------------------------------- 地点
function selectPlace(p) {
  place = p;
  store.set("sorami.place", p);
  $("placeSheet").close();
  selectedDay = {};
  load(true);
}
function renderSheet() {
  $("favList").innerHTML = favorites.length
    ? favorites.map((f, i) => `<div style="display:flex;align-items:center">
        <button class="list-item" style="flex:1" data-fav="${i}"><strong>${esc(f.name)}</strong>
          <div class="tiny">${esc(f.subtitle || "")}</div></button>
        <button data-unfav="${i}" style="padding:8px;color:var(--tertiary)">✕</button></div>`).join("")
    : `<span class="tiny">よく使う地点は選択後、地点名の横の ☆ で登録できます</span>`;
  for (const el of $("favList").querySelectorAll("[data-fav]")) el.onclick = () => selectPlace(favorites[+el.dataset.fav]);
  for (const el of $("favList").querySelectorAll("[data-unfav]")) el.onclick = () => {
    favorites.splice(+el.dataset.unfav, 1); store.set("sorami.favorites", favorites); renderSheet();
  };

  const filter = window._spotFilter || null;
  const phenomenaWithSpots = [...new Set(SORAMI_SPOTS.spots.flatMap((s) => s.phenomena))];
  $("spotChips").innerHTML = `<button class="${!filter ? "on" : ""}" data-chip="">すべて</button>`
    + phenomenaWithSpots.map((p) => `<button class="${filter === p ? "on" : ""}" data-chip="${p}">${S.PHENOMENA[p].name}</button>`).join("");
  for (const el of $("spotChips").querySelectorAll("[data-chip]")) {
    el.onclick = () => { window._spotFilter = el.dataset.chip || null; renderSheet(); };
  }
  const spots = filter ? SORAMI_SPOTS.spots.filter((s) => s.phenomena.includes(filter)) : SORAMI_SPOTS.spots;
  $("spotList").innerHTML = spots.map((s, i) => `<button class="list-item" data-spot="${s.id}">
      <strong>${esc(s.name)}</strong> <span class="tiny">${s.phenomena.map((p) => S.PHENOMENA[p].icon).join("")}</span>
      <div class="tiny">${esc(s.prefecture)} ・ 標高${Math.round(s.elevation)}m ー ${esc(s.note)}</div></button>`).join("");
  for (const el of $("spotList").querySelectorAll("[data-spot]")) {
    el.onclick = () => {
      const s = SORAMI_SPOTS.spots.find((x) => x.id === el.dataset.spot);
      selectPlace({ id: "spot:" + s.id, name: s.name, subtitle: s.prefecture,
        latitude: s.latitude, longitude: s.longitude, terrain: s.terrain, elevation: s.elevation });
    };
  }
}
$("placeButton").onclick = () => { renderSheet(); $("placeSheet").showModal(); };
$("placeClose").onclick = () => $("placeSheet").close();
$("geoButton").onclick = () => {
  $("geoStatus").textContent = "";
  navigator.geolocation.getCurrentPosition(
    (pos) => selectPlace({ id: "current", name: "現在地", subtitle: "",
      latitude: pos.coords.latitude, longitude: pos.coords.longitude, terrain: null, elevation: null }),
    () => { $("geoStatus").textContent = "現在地を取得できませんでした（HTTPS でのみ利用できます）"; },
    { timeout: 10000 });
};
$("searchBox").addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;
  const q = $("searchBox").value.trim();
  if (!q) return;
  $("searchResults").innerHTML = `<p class="tiny">検索中…</p>`;
  try {
    const url = "https://nominatim.openstreetmap.org/search?" + new URLSearchParams(
      { q, format: "jsonv2", limit: "6", countrycodes: "jp", "accept-language": "ja" });
    const results = await (await fetch(url)).json();
    $("searchResults").innerHTML = results.length
      ? results.map((r, i) => `<button class="list-item" data-sr="${i}"><strong>${esc(r.name || r.display_name.split(",")[0])}</strong>
          <div class="tiny">${esc(r.display_name)}</div></button>`).join("")
      : `<p class="tiny">該当なし</p>`;
    for (const el of $("searchResults").querySelectorAll("[data-sr]")) {
      el.onclick = () => {
        const r = results[+el.dataset.sr];
        selectPlace({ id: `search:${r.lat},${r.lon}`, name: r.name || r.display_name.split(",")[0],
          subtitle: r.display_name.split(",").slice(1, 3).join("").trim(),
          latitude: +r.lat, longitude: +r.lon, terrain: null, elevation: null });
      };
    }
  } catch { $("searchResults").innerHTML = `<p class="warn">検索に失敗しました</p>`; }
});

// 選択中の地点をお気に入りへ（地点名タップ長押し代わりに ☆ を出す）
$("placeName").insertAdjacentHTML("afterend",
  ` <button id="favToggle" class="tap" style="font-size:1rem;vertical-align:2px"></button>`);
function renderFavToggle() {
  const isFav = favorites.some((f) => f.id === place.id);
  $("favToggle").textContent = isFav ? "★" : "☆";
  $("favToggle").style.color = isFav ? "var(--accent)" : "var(--tertiary)";
}
$("favToggle").onclick = (e) => {
  e.stopPropagation();
  const i = favorites.findIndex((f) => f.id === place.id);
  if (i >= 0) favorites.splice(i, 1); else favorites.push(place);
  store.set("sorami.favorites", favorites);
  renderFavToggle();
};
new MutationObserver(renderFavToggle).observe($("placeName"), { childList: true });

// 記録は localStorage にあり、ブラウザのデータ消去で消える。
// 校正のために貯めるものなので、書き出して残せるようにしておく。
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), sightings }, null, 1)],
    { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `sorami-sightings-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const incoming = Array.isArray(data) ? data : data.sightings;
    if (!Array.isArray(incoming)) throw new Error("形式が違います");
    // 同じ id は上書き、無いものは追加。取り込みで既存の記録を失わせない。
    const byId = new Map(sightings.map((s) => [s.id, s]));
    for (const rec of incoming) if (rec && rec.id) byId.set(rec.id, rec);
    sightings = [...byId.values()];
    store.set("sorami.sightings", sightings);
    renderRecords();
    alert(`${incoming.length}件を読み込みました（合計 ${sightings.length}件）`);
  } catch (err) {
    alert("読み込めませんでした: " + err.message);
  }
  e.target.value = "";
};

// 幅が閾値をまたいだら描画し直す（ウィンドウのリサイズ・画面回転）
WIDE.addEventListener("change", () => { if (bundle) render(); });

load(false);
</script>
